<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Arch;src:url(archivo-black.woff2)}@font-face{font-family:M;src:url(montserrat-900.woff2)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0710}
.half{position:absolute;top:0;height:720px;width:660px;background-size:cover;background-position:center}
.l{left:-20px;background-image:url(fr_1133.jpg);background-position:58% 25%;background-size:auto 135%;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);filter:saturate(1.3) contrast(1.08)}
.r{right:-20px;background-image:url(fr_patinete.jpg);background-position:40% 50%;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);filter:saturate(.75) brightness(.8)}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 45%)}
.badge{position:absolute;top:455px;width:215px;height:215px;border-radius:30px;font-family:Arch;font-size:185px;line-height:215px;text-align:center;color:#111;box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 0 9px #fff}
.s{left:70px;background:#FF3B4E;transform:rotate(-7deg)}
.d{right:70px;background:#3D8BFF;transform:rotate(7deg)}
.top{position:absolute;left:0;right:0;top:30px;text-align:center;font-family:Arch;font-size:92px;color:#fff;text-shadow:0 8px 0 #000,0 0 30px rgba(0,0,0,.8)}
.top span{color:#FFD400}
.line{position:absolute;left:628px;top:0;width:14px;height:720px;background:#fff;transform:skewX(-7deg);box-shadow:0 0 30px rgba(0,0,0,.8)}
</style></head><body>
<div class="half l"></div><div class="half r"></div><div class="shade"></div><div class="line"></div>
<div class="top">TIER LIST <span>GTA 6</span></div>
<div class="badge s">S</div><div class="badge d">D</div>
</body></html>
