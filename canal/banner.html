<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#0d0418}
svg{position:absolute;inset:0}
.txt{position:absolute;left:0;right:0;top:560px;text-align:center}
.t1{font-family:Anton;font-size:200px;line-height:1;letter-spacing:14px;color:#fff;
 text-shadow:0 0 30px rgba(255,79,139,.8),0 0 80px rgba(255,79,139,.5),0 8px 0 #2a0a4a}
.line{width:520px;height:4px;margin:26px auto 22px;background:linear-gradient(90deg,transparent,#3ef6ff,transparent)}
.t3{font-family:Montserrat;font-weight:800;font-size:38px;letter-spacing:14px;color:#ffe3f3}
</style></head><body><svg id="s" width="2560" height="1440"></svg>
<div class="txt"><div class="t1">NOTICIAS GTA 6</div><div class="line"></div>
<div class="t3">TRÁILERS · LEAKS · NOVEDADES</div></div>
<script>
const P=(d,f)=>`<path d="${d}" fill="${f}"/>`;
function palm(bx,by,tx,ty,s,flip){let g=P(`M${bx-22*s},${by} C${bx},${by-(by-ty)*0.5} ${tx-80*s*flip},${ty+120*s} ${tx-5},${ty} L${tx+8},${ty+10} C${tx-70*s*flip},${ty+140*s} ${bx+20*s},${by-(by-ty)*0.5} ${bx+20*s},${by} Z`,'#0a0312');
 const fr=[[200,1],[165,1.05],[130,.95],[95,.7],[60,.95],[25,1.05],[-5,1],[-30,.85],[-150,.9],[-120,.75]];
 for(const [a0,l] of fr){const a=a0*Math.PI/180,L=230*l*s,ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.45+L*.42,mx=tx+Math.cos(a)*L*.55,my=ty+Math.sin(a)*L*.25-40*s,nx=-(ey-ty)/L*16*s,ny=(ex-tx)/L*16*s;
  g+=P(`M${tx},${ty} Q${mx+nx},${my+ny} ${ex},${ey} Q${mx-nx*.2},${my+28*s} ${tx},${ty+10} Z`,'#0a0312');}
 return g+`<circle cx="${tx}" cy="${ty+6}" r="${14*s}" fill="#0a0312"/>`;}
let g=`<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0418"/><stop offset=".45" stop-color="#3a0d52"/><stop offset=".72" stop-color="#a3175f"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset=".55" stop-color="#ff5f8a"/><stop offset="1" stop-color="#d4146b"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f4a"/><stop offset="1" stop-color="#0d0418"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="40"/></filter>
<mask id="cuts"><rect width="2560" height="1440" fill="#fff"/>`;
for(let i=0;i<7;i++){g+=`<rect x="0" y="${860+i*30}" width="2560" height="${5+i*3}" fill="#000"/>`}
g+=`</mask></defs><rect width="2560" height="1040" fill="url(#sky)"/>`;
for(let i=0;i<90;i++){g+=`<circle cx="${Math.random()*2560}" cy="${Math.random()*420}" r="${Math.random()*2+0.5}" fill="#fff" opacity="${Math.random()*.6+.2}"/>`}
g+=`<circle cx="1280" cy="1040" r="520" fill="#ff4f8b" opacity=".45" filter="url(#glow)"/>`;
g+=`<circle cx="1280" cy="1040" r="470" fill="url(#sun)" mask="url(#cuts)"/>`;
g+=`<rect x="0" y="1040" width="2560" height="400" fill="url(#sea)"/>`;
for(let i=0;i<9;i++){const y=1060+i*i*4+i*12,w=820-i*70;g+=`<rect x="${1280-w/2+(i%2?30:-20)}" y="${y}" width="${w}" height="4" rx="2" fill="#ff7aa8" opacity="${.7-i*.07}"/>`}
g+=`<rect x="0" y="1038" width="2560" height="4" fill="#3ef6ff" opacity=".85"/>`;
g+=palm(220,1440,400,720,1.4,1)+palm(120,1440,200,860,1.1,1)+palm(2340,1440,2160,720,1.4,-1)+palm(2440,1440,2360,860,1.1,-1);
document.getElementById('s').innerHTML=g;
</script></body></html>
