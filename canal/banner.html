<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#12061f}
#c{position:relative;width:2560px;height:1440px;
 background:linear-gradient(180deg,#1a0636 0%,#4a0f5c 30%,#c2185b 52%,#ff6f3c 64%,#ffb347 70%,#12061f 70.2%);}
svg{position:absolute;inset:0}
.txt{position:absolute;left:0;right:0;top:515px;text-align:center}
.t1{font-family:Anton;font-size:215px;line-height:1;letter-spacing:12px;color:#fff;
 text-shadow:0 0 18px #ff2fa8,0 0 50px #ff2fa8,0 0 90px #ff2fa8, 8px 8px 0 #2a0a4a}
.t2{font-family:Pacifico;font-size:105px;color:#3ef6ff;margin-top:-45px;transform:rotate(-4deg);
 text-shadow:0 0 14px #3ef6ff,0 0 40px #00c8ff,5px 5px 0 #2a0a4a}
.t3{font-family:Montserrat;font-weight:900;font-size:34px;letter-spacing:9px;color:#ffe3f3;margin-top:5px}
</style></head><body><div id="c"><svg id="s" width="2560" height="1440"></svg>
<div class="txt"><div class="t1">GTA 6 AL DÍA</div><div class="t2">Vice City News</div>
<div class="t3">NOTICIAS · LEAKS · TRÁILERS · TEORÍAS</div></div></div>
<script src="shared.js"></script><script>
let g='';
// sun
g+=`<defs><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe36e"/><stop offset="1" stop-color="#ff3d7f"/></linearGradient>
<clipPath id="cut"><rect x="0" y="0" width="2560" height="1008"/></clipPath></defs>`;
g+=`<g clip-path="url(#cut)"><circle cx="1280" cy="1000" r="430" fill="url(#sun)" opacity="0.95"/>`;
for(let i=0;i<9;i++){const y=760+i*30+i*i*2;g+=`<rect x="800" y="${y}" width="960" height="${6+i*2}" fill="#c2185b"/>`}
g+=`</g>`;
// stars
for(let i=0;i<120;i++){g+=`<circle cx="${Math.random()*2560}" cy="${Math.random()*500}" r="${Math.random()*2.5+0.5}" fill="#fff" opacity="${Math.random()*0.8+0.2}"/>`}
// skyline
let x=0;while(x<2560){const w=40+Math.random()*90,h=60+Math.random()*(Math.abs(x-1280)<500?120:230);
 g+=`<rect x="${x}" y="${1008-h}" width="${w}" height="${h}" fill="#2a0a4a"/>`;
 for(let k=0;k<6;k++)g+=`<rect x="${x+8+Math.random()*(w-16)}" y="${1008-h+10+Math.random()*(h-20)}" width="5" height="7" fill="#ffd36e" opacity="0.7"/>`;
 x+=w+4}
// grid floor
g+=`<rect x="0" y="1008" width="2560" height="432" fill="#12061f"/>`;
for(let i=0;i<14;i++){const y=1008+Math.pow(i/13,2)*432;g+=`<line x1="0" y1="${y}" x2="2560" y2="${y}" stroke="#ff2fa8" stroke-width="3" opacity="0.7"/>`}
for(let i=-20;i<=20;i++){g+=`<line x1="${1280+i*30}" y1="1008" x2="${1280+i*260}" y2="1440" stroke="#ff2fa8" stroke-width="3" opacity="0.6"/>`}
g+=`<line x1="0" y1="1008" x2="2560" y2="1008" stroke="#3ef6ff" stroke-width="4"/>`;
// palms (inside and outside safe area)
g+=palm(420,1060,560,60,1.5)+palm(260,1080,420,-50,1.1)+palm(2140,1060,560,-60,1.5)+palm(2310,1080,420,50,1.1);
document.getElementById('s').innerHTML=g;
</script></body></html>
