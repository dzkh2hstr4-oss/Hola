<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:800px;height:800px;overflow:hidden;background:#0d0418}</style></head><body>
<svg id="s" width="800" height="800"></svg>
<script>
const P=(d,f)=>`<path d="${d}" fill="${f}"/>`;
let g=`<defs>
<radialGradient id="bg" cx="50%" cy="60%" r="70%"><stop offset="0" stop-color="#3a0d52"/><stop offset="1" stop-color="#0d0418"/></radialGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset=".55" stop-color="#ff5f8a"/><stop offset="1" stop-color="#d4146b"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f4a"/><stop offset="1" stop-color="#0d0418"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
<mask id="cuts"><rect width="800" height="800" fill="#fff"/>`;
for(let i=0;i<6;i++){g+=`<rect x="0" y="${430+i*26}" width="800" height="${4+i*2.6}" fill="#000"/>`}
g+=`</mask></defs><rect width="800" height="800" fill="url(#bg)"/>`;
g+=`<circle cx="400" cy="400" r="250" fill="#ff4f8b" opacity=".55" filter="url(#glow)"/>`;
g+=`<circle cx="400" cy="400" r="230" fill="url(#sun)" mask="url(#cuts)"/>`;
// sea
g+=`<rect x="0" y="560" width="800" height="240" fill="url(#sea)"/>`;
for(let i=0;i<7;i++){const y=575+i*i*5+i*8,w=300-i*30;g+=`<rect x="${400-w/2+(i%2?18:-12)}" y="${y}" width="${w}" height="3" rx="1.5" fill="#ff7aa8" opacity="${0.75-i*0.09}"/>`}
g+=`<rect x="0" y="558" width="800" height="3" fill="#3ef6ff" opacity=".85"/>`;
// palm: curved trunk from bottom-left leaning right
const bx=250,by=800, tx=470, ty=250;
g+=P(`M${bx-26},${by} C${bx-10},600 ${tx-120},360 ${tx-6},${ty} L${tx+8},${ty+10} C${tx-100},380 ${bx+20},600 ${bx+22},${by} Z`,'#0a0312');
// fronds
const fr=[[200,1.0],[165,1.05],[130,.95],[95,.7],[60,.95],[25,1.05],[-5,1.0],[-30,.85],[-150,.9],[-120,.75]];
for(const [a0,l] of fr){const a=a0*Math.PI/180,L=230*l;
 const ex=tx+Math.cos(a)*L, ey=ty+Math.sin(a)*L*0.45+L*0.42;
 const mx=tx+Math.cos(a)*L*0.55, my=ty+Math.sin(a)*L*0.25-40;
 const nx=-(ey-ty)/L*16, ny=(ex-tx)/L*16;
 g+=P(`M${tx},${ty} Q${mx+nx},${my+ny} ${ex},${ey} Q${mx-nx*0.2},${my+28} ${tx},${ty+10} Z`,'#0a0312');}
g+=`<circle cx="${tx}" cy="${ty+6}" r="14" fill="#0a0312"/>`;
document.getElementById('s').innerHTML=g;
</script></body></html>
