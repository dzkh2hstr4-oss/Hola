<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(anton.woff2)}
@font-face{font-family:M;src:url(montserrat-900.woff2);font-weight:900}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#14042a}
.bg{position:absolute;inset:0;background:url(vice_city_27.jpg) center/cover;filter:saturate(1.5) brightness(.55)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,62,165,.45),rgba(20,4,42,.2) 45%,rgba(20,4,42,.85) 100%)}
.l{position:absolute;left:-40px;top:0;width:560px;height:720px;background:url(lucia_caminos_13.jpg) 38% 40%/auto 150%;clip-path:polygon(0 0,100% 0,78% 100%,0 100%);filter:saturate(1.25) contrast(1.1)}
.r{position:absolute;right:-40px;top:0;width:560px;height:720px;background:url(jason_duval_17.jpg) -230px -40px/auto 150%;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);filter:saturate(1.25) contrast(1.1)}
.edgeL{position:absolute;left:-40px;top:0;width:560px;height:720px;clip-path:polygon(97% 0,100% 0,78% 100%,75% 100%);background:#FF3EA5;box-shadow:0 0 30px #FF3EA5}
.edgeR{position:absolute;right:-40px;top:0;width:560px;height:720px;clip-path:polygon(22% 0,25% 0,3% 100%,0 100%);background:#3EF6FF}
.c{position:absolute;left:0;right:0;top:120px;text-align:center}
.t1{font-family:Anton;font-size:250px;line-height:.9;color:transparent;background:linear-gradient(180deg,#fff 20%,#FFB13B 55%,#FF3EA5);-webkit-background-clip:text;filter:drop-shadow(0 10px 0 #14042a) drop-shadow(0 0 40px #FF3EA5)}
.t2{display:inline-block;margin-top:14px;font-family:Anton;font-size:96px;color:#14042a;background:#FFE14A;padding:4px 30px;transform:rotate(-3deg);box-shadow:0 12px 0 #14042a,0 0 40px rgba(255,225,74,.6)}
.t3{display:inline-block;margin-top:26px;font-family:M;font-weight:900;font-size:40px;color:#fff;background:#FF2D2D;padding:10px 24px;border-radius:12px;transform:rotate(2deg);box-shadow:0 10px 0 #14042a}
.emo{position:absolute;font-size:110px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<div class="l"></div><div class="r"></div><div class="edgeL"></div><div class="edgeR"></div>
<div class="c"><div class="t1">GTA 6</div><div class="t2">ANTES DE JUGAR</div><br><div class="t3">TODO LO QUE DEBES SABER</div></div>
<div class="emo" style="left:300px;top:40px;transform:rotate(-14deg)">😱</div>
<div class="emo" style="right:300px;top:40px;transform:rotate(12deg);font-size:100px">🔥</div>
</body></html>
